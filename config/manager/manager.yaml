apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiworkload-operator
  namespace: ai-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiworkload-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiworkload-manager-role
subjects:
- kind: ServiceAccount
  name: aiworkload-operator
  namespace: ai-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiworkload-operator
  namespace: ai-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aiworkload-operator
  template:
    metadata:
      labels:
        app: aiworkload-operator
    spec:
      serviceAccountName: aiworkload-operator
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: manager
        image: gpu-node-selector/operator:dev
        imagePullPolicy: IfNotPresent
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - {name: health, containerPort: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: health}
          initialDelaySeconds: 10
        readinessProbe:
          httpGet: {path: /readyz, port: health}
