---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiworkload-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ai.dhiraj.io
  resources:
  - aiworkloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ai.dhiraj.io
  resources:
  - aiworkloads/finalizers
  verbs:
  - update
- apiGroups:
  - ai.dhiraj.io
  resources:
  - aiworkloads/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
